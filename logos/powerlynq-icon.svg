<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <!-- Dark navy rounded square -->
  <rect x="36" y="36" width="728" height="728" rx="128" ry="128" fill="#0a1628"/>
  <!-- Cyan border -->
  <rect x="36" y="36" width="728" height="728" rx="128" ry="128" fill="none" stroke="#22d3ee" stroke-width="14"/>
  
  <!-- Left chevron -->
  <path d="M305 255 L175 400 L305 545" 
        stroke="#94a3b8" 
        stroke-width="56" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Right chevron -->
  <path d="M495 255 L625 400 L495 545" 
        stroke="#94a3b8" 
        stroke-width="56" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Cyan connection bar - more prominent capsule -->
  <rect x="270" y="355" width="260" height="90" rx="45" ry="45" fill="#22d3ee"/>
</svg>
